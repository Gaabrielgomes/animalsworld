spring.config.import=optional:file:.env[.properties]

spring.application.name=api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:animalsworldapi}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=always
server.port=${SERVER_PORT:8889}

animalsworld.security.initial-employee.login=${INITIAL_EMPLOYEE_LOGIN:admin}
animalsworld.security.initial-employee.password=${INITIAL_EMPLOYEE_PASSWORD}
animalsworld.security.initial-employee.name=${INITIAL_EMPLOYEE_NAME:Initial Employee}
animalsworld.security.initial-employee.email=${INITIAL_EMPLOYEE_EMAIL:admin@animalsworld.com}
animalsworld.security.initial-employee.ssn=${INITIAL_EMPLOYEE_SSN:100-10-1000}
